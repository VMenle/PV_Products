<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy & Leisure - Balkonkraftwerke</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f5f9ff 0%, #eef2f8 100%);
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(8px);
            padding: 1rem 2rem;
            border-radius: 60px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1a4d2e, #2d7a4b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .update-info {
            font-size: 0.75rem;
            color: #4a5b6e;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 2rem;
        }
        .product-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.15);
        }
        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #f8fafc;
            border-bottom: 1px solid #eee;
        }
        .card-content {
            padding: 1.4rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .product-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            color: #0a2b1f;
        }
        .leistung {
            font-size: 0.8rem;
            color: #2d7a4b;
            background: #e6f4ea;
            display: inline-block;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            margin-bottom: 0.8rem;
            font-weight: 500;
        }
        .beschreibung {
            color: #334155;
            font-size: 0.9rem;
            line-height: 1.45;
            margin: 0.7rem 0;
            flex: 1;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 1rem 0 0.6rem;
            border-top: 1px solid #ecf3fa;
            padding-top: 1rem;
        }
        .price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a4d2e;
        }
        .wechselrichter {
            font-size: 0.8rem;
            background: #f1f5f9;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }
        .anfrage-btn {
            background: #1a4d2e;
            color: white;
            border: none;
            padding: 0.7rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 0.6rem;
            font-family: inherit;
        }
        .anfrage-btn:hover {
            background: #0f3a22;
        }
        .loading {
            text-align: center;
            padding: 4rem;
            font-size: 1.2rem;
            color: #4a5b6e;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 28px;
            padding: 2rem;
            max-width: 550px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 {
            margin-bottom: 1rem;
            color: #1a4d2e;
            font-size: 1.4rem;
        }
        .modal-content label {
            display: block;
            margin: 0.8rem 0 0.3rem;
            font-weight: 600;
            color: #1e2a3a;
        }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            padding: 0.7rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .modal-content input:focus, .modal-content textarea:focus {
            outline: none;
            border-color: #2d7a4b;
        }
        .checkbox-group {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.5rem;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: normal;
        }
        .checkbox-group input {
            width: auto;
        }
        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .send-btn {
            background: #1a4d2e;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }
        .cancel-btn {
            background: #e2e8f0;
            color: #1e2a3a;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
        }
        footer {
            text-align: center;
            margin-top: 3rem;
            padding: 1.5rem;
            color: #6c7a8a;
            font-size: 0.8rem;
        }
        @media (max-width: 700px) {
            body { padding: 1rem; }
            .header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>☀️ Energy & Leisure – Balkonkraftwerke 800W</h1>
        <div class="update-info">🔄 Tägliche Angebote | 📦 Komplettsets mit Growatt</div>
    </div>

    <div id="productsContainer" class="products-grid">
        <div class="loading">📡 Lade Angebote ...</div>
    </div>
    <footer>
        🔋 Individuelle Anfrage – wir erstellen dir ein persönliches Angebot mit/ohne Installation & Halterung
    </footer>
</div>

<div id="anfrageModal" class="modal">
    <div class="modal-content">
        <h3>📋 Anfrage für Balkonkraftwerk</h3>
        <label>Produkt</label>
        <input type="text" id="modalProdukt" readonly style="background:#f5f5f5;">

        <label>Name *</label>
        <input type="text" id="modalName" placeholder="Ihr vollständiger Name">

        <label>Email *</label>
        <input type="email" id="modalEmail" placeholder="ihre@email.de">

        <label>Ortschaft (PLZ/Ort) *</label>
        <input type="text" id="modalOrt" placeholder="z.B. 73450 Neresheim">

        <label>Zusatzoptionen</label>
        <div class="checkbox-group">
            <label><input type="checkbox" id="optInstallation"> Installation gewünscht</label>
            <label><input type="checkbox" id="optHalterung"> Halterung gewünscht</label>
        </div>

        <label>Ihre Nachricht / Fragen</label>
        <textarea id="modalNachricht" rows="4" placeholder="Besondere Wünsche, Montageort, etc."></textarea>

        <div class="modal-buttons">
            <button class="send-btn" onclick="sendAnfrage()">📧 Anfrage senden</button>
            <button class="cancel-btn" onclick="closeModal()">Abbrechen</button>
        </div>
    </div>
</div>

<script>
    const JSON_URL = 'angebote.json';
    let currentProduct = null;

    async function loadProducts() {
        try {
            const response = await fetch(JSON_URL + '?t=' + Date.now());
            if (!response.ok) throw new Error('JSON nicht gefunden');
            const produkte = await response.json();
            renderProducts(produkte);
        } catch (error) {
            document.getElementById('productsContainer').innerHTML = '<div class="loading">❌ Fehler beim Laden der Angebote: ' + error.message + '</div>';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderProducts(produkte) {
        if (!produkte || produkte.length === 0) {
            document.getElementById('productsContainer').innerHTML = '<div class="loading">Keine Angebote vorhanden</div>';
            return;
        }

        const html = produkte.map(p => {
            const titel = p.titel || p.name || 'Balkonkraftwerk';
            const preisText = p.preis_text || (p.preis ? p.preis.toFixed(2).replace('.', ',') + ' €' : 'Auf Anfrage');
            const beschreibung = p.beschreibung || 'Komplettset mit Balkonkraftwerk 800W';
            const verfuegbarkeit = p.verfuegbarkeit || '✅ Verfügbar';
            const wechselrichter = p.wechselrichter || 'Growatt NEO 800M-X';
            const leistung = p.leistung || '800W';
            const bild = p.bild || 'https://placehold.co/600x400/1a4d2e/white?text=Solar';
            
            return `
                <div class="product-card">
                    <img class="card-img" src="${bild}" alt="${escapeHtml(titel)}" onerror="this.src='https://placehold.co/600x400/1a4d2e/white?text=Solar'">
                    <div class="card-content">
                        <div class="product-title">${escapeHtml(titel)}</div>
                        <div><span class="leistung">⚡ ${escapeHtml(leistung)}</span></div>
                        <div class="beschreibung">${escapeHtml(beschreibung)}</div>
                        <div class="price-row">
                            <span class="price">${escapeHtml(preisText)}</span>
                            <span class="wechselrichter">🔌 ${escapeHtml(wechselrichter)}</span>
                        </div>
                        <div class="verfuegbarkeit">${escapeHtml(verfuegbarkeit)}</div>
                        <button class="anfrage-btn" onclick='openAnfrage(${JSON.stringify(p).replace(/'/g, "&#39;")})'>📩 Angebot anfragen</button>
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('productsContainer').innerHTML = html;
    }

    function openAnfrage(produkt) {
        currentProduct = produkt;
        const titel = produkt.titel || produkt.name || 'Balkonkraftwerk';
        const preisText = produkt.preis_text || (produkt.preis ? produkt.preis.toFixed(2).replace('.', ',') + ' €' : 'Auf Anfrage');
        
        document.getElementById('modalProdukt').value = titel + ' - ' + preisText;
        document.getElementById('modalName').value = '';
        document.getElementById('modalEmail').value = '';
        document.getElementById('modalOrt').value = '';
        document.getElementById('optInstallation').checked = false;
        document.getElementById('optHalterung').checked = false;
        
        let vorschlag = `Ich interessiere mich für das Balkonkraftwerk:\n${titel}\nPreis: ${preisText}\n\n`;
        vorschlag += `Bitte senden Sie mir ein individuelles Angebot.`;
        document.getElementById('modalNachricht').value = vorschlag;
        
        document.getElementById('anfrageModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('anfrageModal').style.display = 'none';
        currentProduct = null;
    }

    function sendAnfrage() {
        const name = document.getElementById('modalName').value.trim();
        const email = document.getElementById('modalEmail').value.trim();
        const ort = document.getElementById('modalOrt').value.trim();
        const installation = document.getElementById('optInstallation').checked;
        const halterung = document.getElementById('optHalterung').checked;
        let nachricht = document.getElementById('modalNachricht').value;

        if (!name || !email || !ort) {
            alert('Bitte Name, Email und Ortschaft ausfüllen.');
            return;
        }

        let extras = '';
        if (installation) extras += ', Installation gewünscht';
        if (halterung) extras += ', Halterung gewünscht';
        if (extras) nachricht += `\n\nZusatzwünsche:${extras}`;

        const titel = currentProduct?.titel || currentProduct?.name || 'Balkonkraftwerk';
        const betreff = encodeURIComponent(`Anfrage Balkonkraftwerk: ${titel}`);
        const body = encodeURIComponent(
            `Name: ${name}\n` +
            `Email: ${email}\n` +
            `Ortschaft: ${ort}\n\n` +
            `${nachricht}`
        );

        // HIER DEINE EMAIL ADRESSE EINTRAGEN:
        window.location.href = `mailto:ihre-email@example.com?subject=${betreff}&body=${body}`;
        
        alert('Ihre Anfrage wird per Email geöffnet. Bitte senden Sie sie ab.');
        closeModal();
    }

    loadProducts();
</script>
</body>
</html>
